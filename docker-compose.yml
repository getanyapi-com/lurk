services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reddit_leads
      POSTGRES_PASSWORD: reddit_leads
      POSTGRES_DB: reddit_leads
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reddit_leads"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://reddit_leads:reddit_leads@postgres:5432/reddit_leads
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      SELF_HOSTED: ${SELF_HOSTED:-true}
      RUN_SCHEDULER: ${RUN_SCHEDULER:-true}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set your Clerk publishable key}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set your Clerk secret key}
      ANYAPI_BASE_URL: ${ANYAPI_BASE_URL:-https://api.getanyapi.com}
      ANYAPI_OAUTH_CLIENT_ID: ${ANYAPI_OAUTH_CLIENT_ID:-}
      ANYAPI_HOUSE_API_KEY: ${ANYAPI_HOUSE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta/muse-spark-1.3-contributor}
      JEV_MODEL: ${JEV_MODEL:-~typesafe/jev-latest}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      JEV_GATEWAY_MODEL: ${JEV_GATEWAY_MODEL:-typesafe-ai/jev}
      ALERTS_FROM_EMAIL: ${ALERTS_FROM_EMAIL:-}
      AZURE_EMAIL_CONNECTION_STRING: ${AZURE_EMAIL_CONNECTION_STRING:-}
      SMTP_URL: ${SMTP_URL:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      HOUSE_DATA_CAP_USD_PER_DAY: ${HOUSE_DATA_CAP_USD_PER_DAY:-25}
      HOUSE_LLM_CAP_USD_PER_DAY: ${HOUSE_LLM_CAP_USD_PER_DAY:-10}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
