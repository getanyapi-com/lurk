name: Deploy

# Every push to main builds the image, pushes it to the registry, rolls the
# container app, and waits for the public health path to answer. The repository
# variables and secrets it reads are listed in the deploy section of README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
      IMAGE: reddit-leads
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        run: |
          set -euo pipefail
          az acr login --name "$REGISTRY"
          TAG="$REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}"
          docker build -t "$TAG" .
          docker push "$TAG"

      # The image applies its own migrations from docker-entrypoint.sh before it
      # serves, and the app is pinned to one replica, so a deploy runs them once.
      - name: Roll the container app
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}" \
            --revision-suffix "s$(echo '${{ github.sha }}' | cut -c1-8)" \
            --output none

      - name: Show the active revisions
        run: |
          az containerapp revision list \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.active].{name:name,state:properties.runningState,traffic:properties.trafficWeight}" \
            --output table

      # The step's own timeout is the whole budget for the new revision to start
      # serving; raise it here if a cold start ever needs longer.
      - name: Wait for the deployed instance to answer
        timeout-minutes: 10
        run: |
          set -euo pipefail
          until [ "$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL")" = "200" ]; do
            echo "waiting for $HEALTH_URL"
            sleep 5
          done
          echo "$HEALTH_URL answered 200"
